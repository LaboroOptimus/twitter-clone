events {}

http {
    upstream users_service { server user-service:8080; }
    upstream posts_service { server posts-service:8081; }

    server {
        listen 80;

        # users
        location /api/users/ { proxy_pass http://users_service/; }   # режет /api/users/
        # posts
        location /api/posts/ { proxy_pass http://posts_service/; }   # режет /api/posts/

        location /users/ { proxy_pass http://users_service/; }
        location /posts/ { proxy_pass http://posts_service/; }

   
    }
}